<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>YouTube Lite</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-text-size-adjust:100%}
html.s{font-size:12.5px}
html.p{font-size:15px}
html.t{font-size:16px}
html.tv{font-size:max(14px,1.25vw)}
html,body{max-width:100%;overflow-x:hidden}
body{background:#0f0f0f;color:#fff;font-family:system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0f0f0f;padding:.6rem .8rem;display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.logo{font-weight:800;color:#f00;font-size:1.2rem;white-space:nowrap}
.logo span{color:#fff}
html.s .logo span{display:none}
form{flex:1 1 9rem;min-width:0;display:flex}
input{flex:1;min-width:0;width:100%;background:#121212;border:1px solid #303030;color:#fff;padding:.6rem .9rem;border-radius:1.4rem 0 0 1.4rem;font-size:1rem;outline:none}
button{background:#222;border:1px solid #303030;color:#fff;padding:.5rem .9rem;font-size:1rem;border-radius:1.4rem}
form button{border-radius:0 1.4rem 1.4rem 0;padding:0 1rem}
a.gear{color:#fff;text-decoration:none;padding:.5rem .4rem;font-size:1.2rem}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,17rem),1fr));gap:1.1rem;padding:.8rem}
html.s .grid,html.p .grid{grid-template-columns:minmax(0,1fr);gap:1rem;padding:.6rem}
html.tv .grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:1.2rem;padding:1rem 1.4rem}
.card{cursor:pointer;scroll-margin-top:5rem;min-width:0}
.card:focus,.chip:focus,button:focus,a.gear:focus,input:focus{outline:3px solid #fff;outline-offset:3px}
.th{position:relative;aspect-ratio:16/9;background:#222;border-radius:.8rem;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.dur{position:absolute;right:.4rem;bottom:.4rem;background:#000c;padding:.1rem .35rem;border-radius:.3rem;font-size:.8rem;font-weight:600}
.t{margin-top:.5rem;font-size:1rem;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.m{margin-top:.2rem;font-size:.8rem;color:#aaa;overflow:hidden;text-overflow:ellipsis}
#msg{text-align:center;color:#aaa;padding:2rem .8rem;word-break:break-word}
#more{display:none;margin:.8rem auto 6rem;background:#f00;border:0;font-weight:700;padding:.8rem 2rem}
#fab{display:none;position:fixed;right:.9rem;bottom:1.1rem;z-index:6;background:#f00;border:0;font-weight:700;padding:.8rem 1.2rem;box-shadow:0 2px 10px #000a}
#player{position:fixed;inset:0;background:#000f;z-index:10;display:none;flex-direction:column;overflow:auto}
#player.on{display:flex}
#player .box{width:100%;max-width:60rem;margin:auto}
#player .v{position:relative;aspect-ratio:16/9}
#player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
#player .info{padding:.8rem}
.bar{display:flex;justify-content:space-between;gap:.5rem;padding:.6rem;flex-wrap:wrap}
#hist{position:fixed;inset:0;background:#0f0f0f;z-index:8;display:none;overflow:auto}
#hist.on{display:block}
#hist h3{padding:1rem .8rem .3rem;font-size:1.1rem}
.chips{padding:.4rem .8rem;display:flex;flex-wrap:wrap;gap:.5rem}
.chip{background:#222;padding:.5rem .9rem;border-radius:1rem;font-size:.9rem;cursor:pointer;max-width:100%;word-break:break-word}

#player .stage,#player .info{flex:none}
#player .stage{display:flex;flex-direction:column;width:100%;max-width:60rem;margin:0 auto}
#player .side{order:-1;display:flex;justify-content:space-between;gap:.5rem;padding:.6rem}
#cbtn{display:none}
#player .info{width:100%;max-width:60rem;margin:0 auto;padding:.8rem}
.ch{font-size:1.05rem;margin:1rem 0 .6rem}
.cmt{display:flex;gap:.7rem;margin-bottom:1rem}
.cmt img{width:2.2rem;height:2.2rem;border-radius:50%;flex:none;background:#222}
.cmt>div{min-width:0}
.cn{font-size:.8rem;font-weight:600}
.cn span{color:#aaa;font-weight:400;margin-left:.4rem}
.ct{font-size:.9rem;line-height:1.35;margin-top:.15rem;white-space:pre-wrap;word-break:break-word}
.cl{font-size:.8rem;color:#aaa;margin-top:.25rem}
#cmore{display:none;margin:.5rem auto 3rem}
@media (orientation:landscape){
  #player .stage{max-width:none;margin:0;flex-direction:row;height:100vh;justify-content:center;align-items:center;background:#000}
  #player .side{order:0;flex-direction:column;justify-content:center;align-items:center;width:3.6rem;padding:0}
  #player .side span{display:none}
  #player .side button{width:2.8rem;height:2.8rem;padding:0;border-radius:50%;font-size:1.1rem}
  #cbtn{display:block}
  #player .v{width:min(calc(100vw - 3.6rem),calc(100vh * 16 / 9));height:min(100vh,calc((100vw - 3.6rem) * 9 / 16));aspect-ratio:auto}
}
</style>
</head>
<body>
<header>
  <div class="logo">▶<span> Lite</span></div>
  <form id="f"><input id="q" placeholder="Cari video..." autocomplete="off"><button>Cari</button></form>
  <button id="hb">🕘</button><a class="gear" href="app://settings">⚙</a>
</header>
<div class="grid" id="grid"></div>
<div id="msg"></div>
<button id="more">Lanjut ▼</button>
<button id="fab">Lanjut ↓</button>

<div id="hist">
  <div class="bar"><button id="hc">✕ Tutup</button><button id="hx">🗑 Hapus semua</button></div>
  <h3>Pencarian terakhir</h3><div class="chips" id="hs"></div>
  <h3>Terakhir ditonton</h3><div class="grid" id="hw"></div>
</div>

<div id="player">
  <div class="stage">
    <div class="v"><iframe id="fr" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div>
    <div class="side">
      <button id="close"><b>✕</b><span> Tutup</span></button>
      <button id="cbtn">💬</button>
      <button id="next"><span>Video selanjutnya </span><b>▶</b></button>
    </div>
  </div>
  <div class="info">
    <div class="t" id="pt" style="-webkit-line-clamp:3"></div>
    <div class="m" id="pm"></div>
    <h3 class="ch" id="cmhead">Komentar</h3>
    <div id="cm"></div>
    <button id="cmore">Muat lebih banyak</button>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LH={
  get(){try{return JSON.parse(AppHist.get())}catch(e){return {watch:[],search:[]}}},
  post(b){
    const h=this.get();
    if(b.type==="watch"&&b.video&&b.video.id){h.watch=[b.video].concat((h.watch||[]).filter(x=>x.id!==b.video.id)).slice(0,200)}
    else if(b.type==="search"&&b.q){const q=b.q.trim();h.search=[q].concat((h.search||[]).filter(x=>x.toLowerCase()!==q.toLowerCase())).slice(0,50)}
    else if(b.type==="clear"){h.watch=[];h.search=[]}
    AppHist.set(JSON.stringify(h));
  }
};
const post=b=>window.AppHist?LH.post(b):fetch("/api/history",{method:"POST",body:JSON.stringify(b)}).catch(()=>{});
let q="populer indonesia",page=0,list=[],busy=false,hw=[],cur=-1;

function card(v,i,attr){
  return `<div class="card" tabindex="0" ${attr}="${i}"><div class="th"><img loading="lazy" src="${v.thumb}">${v.dur?`<span class="dur">${esc(v.dur)}</span>`:""}</div>
  <div class="t">${esc(v.title)}</div><div class="m">${esc(v.channel)}</div><div class="m">${esc(v.views)}</div></div>`;
}

async function load(reset){
  if(busy)return -1; busy=true;
  if(reset){page=0;list=[];$("grid").innerHTML="";$("more").style.display="none";$("fab").style.display="none"}
  page++; $("msg").textContent="Memuat...";
  const start=list.length;
  try{
    const d=await (await fetch("/api/search?q="+encodeURIComponent(q)+"&page="+page)).json();
    if(d.error){$("msg").textContent="Error: "+d.error;page--;return -1}
    const seen=new Set(list.map(x=>x.id));
    const items=d.items.filter(x=>!seen.has(x.id));
    list=list.concat(items);
    $("grid").insertAdjacentHTML("beforeend",items.map((v,k)=>card(v,start+k,"data-i")).join(""));
    $("msg").textContent=list.length?"":"Tidak ada hasil.";
    $("more").style.display=d.more?"block":"none";
    $("fab").style.display=d.more?"block":"none";
    return start;
  }catch(e){$("msg").textContent="Gagal memuat: "+e;page--;setTimeout(()=>location.reload(),2500);return -1}
  finally{busy=false}
}

async function lanjut(){
  const s=await load(false);
  if(s>=0){const el=document.querySelector('[data-i="'+s+'"]');if(el)el.scrollIntoView({behavior:"smooth",block:"start"})}
}

function play(v){
  cur=list.findIndex(x=>x.id===v.id);
  $("fr").src="https://www.youtube-nocookie.com/embed/"+v.id+"?autoplay=1&rel=0";
  $("pt").textContent=v.title;$("pm").textContent=v.channel+" • "+v.views;
  $("next").style.display=cur>=0?"block":"none";
  $("player").classList.add("on");
  post({type:"watch",video:v});
  cmId=v.id;$("player").scrollTop=0;loadComments(false);
}

async function nextVideo(){
  if(cur<0)return;
  if(cur+1>=list.length){await load(false)}
  if(cur+1<list.length)play(list[cur+1]);
}

async function openHist(){
  const h=window.AppHist?LH.get():await (await fetch("/api/history")).json();
  hw=h.watch||[];
  $("hs").innerHTML=(h.search||[]).map(s=>`<span class="chip" tabindex="0">${esc(s)}</span>`).join("")||'<div class="m">Belum ada.</div>';
  $("hw").innerHTML=hw.map((v,i)=>card(v,i,"data-h")).join("")||'<div class="m" style="padding:12px">Belum ada.</div>';
  $("hist").classList.add("on");
}

let cmN=0,cmId="";
const kf=n=>n>=1e6?(n/1e6).toFixed(1)+" jt":n>=1e3?(n/1e3).toFixed(n>=1e4?0:1)+" rb":""+n;
async function loadComments(more){
  const id=cmId;
  if(more){cmN+=20}else{cmN=20;$("cm").innerHTML='<div class="m">Memuat komentar...</div>';$("cmore").style.display="none"}
  try{
    const d=await (await fetch("/api/comments?id="+id+"&n="+cmN)).json();
    if(id!==cmId)return;
    if(d.error){$("cm").innerHTML='<div class="m">Komentar gagal dimuat.</div>';return}
    if(!d.items.length){$("cm").innerHTML='<div class="m">Komentar tidak tersedia atau dimatikan.</div>';return}
    $("cm").innerHTML=d.items.map(c=>'<div class="cmt"><img loading="lazy" src="'+esc(c.avatar)+'"><div><div class="cn">'+esc(c.author)+(c.pinned?" 📌":"")+'<span>'+esc(c.time)+'</span></div><div class="ct">'+esc(c.text)+'</div><div class="cl">👍 '+kf(c.likes||0)+'</div></div></div>').join("");
    $("cmore").style.display=d.items.length>=cmN?"block":"none";
  }catch(e){if(id===cmId)$("cm").innerHTML='<div class="m">Komentar gagal dimuat.</div>'}
}
$("cmore").onclick=()=>loadComments(true);
$("cbtn").onclick=()=>$("cmhead").scrollIntoView({behavior:"smooth"});
document.addEventListener("click",e=>{
  let c=e.target.closest("[data-i]"); if(c){play(list[+c.dataset.i]);return}
  c=e.target.closest("[data-h]"); if(c){play(hw[+c.dataset.h]);return}
  c=e.target.closest(".chip"); if(c){
    q=c.textContent;$("q").value=q;$("hist").classList.remove("on");post({type:"search",q});load(true);window.scrollTo(0,0)}
});
$("more").onclick=lanjut; $("fab").onclick=lanjut; $("next").onclick=nextVideo;
$("hb").onclick=openHist; $("hc").onclick=()=>$("hist").classList.remove("on");
$("hx").onclick=async()=>{await post({type:"clear"});openHist()};
$("close").onclick=()=>{$("fr").src="";$("player").classList.remove("on")};
$("f").onsubmit=e=>{e.preventDefault();const t=$("q").value.trim();if(t){q=t;post({type:"search",q});load(true);$("q").blur();window.scrollTo(0,0)}};
(function(){
  const h=document.documentElement;
  function setMode(){
    const u=new URLSearchParams(location.search).get("ui");
    const w=window.innerWidth;
    h.className=["s","p","t","tv"].includes(u)?u:(w<=360?"s":w<600?"p":"t");
  }
  setMode();addEventListener("resize",setMode);
})();
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"){const c=e.target.closest&&e.target.closest(".card,.chip");if(c)c.click()}
});
load(true);
</script>
</body>
</html>
